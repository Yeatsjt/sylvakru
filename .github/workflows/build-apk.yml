name: Build Flutter APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.8'        # ⬅ 改成你本地 flutter --version 的值

      - run: flutter pub get
      - run: flutter build apk --debug      # 真机想更稳可换 --profile（无需签名）

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk   # ⬅ 注意：在【根目录】的 build/ 下，不是 android/ 下
          retention-days: 7
