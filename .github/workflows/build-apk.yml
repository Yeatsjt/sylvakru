name: Release Signed APK (multi-ABI)

on:
  push:
    tags: ['v*']                 # 推 v1.2.3 这样的 tag 自动发版
  workflow_dispatch:             # 或手动 Run workflow 填版本号发版
    inputs:
      tag:
        description: 'Release 版本号，例如 v1.2.3'
        required: true
      notes:
        description: 'Release 说明（可留空）'
        required: false
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write                # 创建 Release / tag 必需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 解析本次发布的 tag / 说明 / 是否预发布 ----------
      - name: Resolve release meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            NOTES="${{ inputs.notes }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            NOTES=""
            PRE="false"
          fi
          [ -z "$NOTES" ] && NOTES="Automated signed multi-ABI release build for **$TAG**."
          [ -z "$PRE" ]   && PRE="false"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF"      >> "$GITHUB_OUTPUT"
          echo "$NOTES"          >> "$GITHUB_OUTPUT"
          echo "EOF"             >> "$GITHUB_OUTPUT"
          echo "✅ Release tag = $TAG"

      # ---------- 读作者钉死的 Flutter 版本（.fvmrc） ----------
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: |
          VER=""
          if [ -f .fvmrc ]; then
            VER=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(tr -d '[:space:]' < .fvmrc)
          fi
          VER=${VER:-stable}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "✅ Flutter 版本 = $VER"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 还原 keystore + 生成 key.properties（对接作者 gradle） ----------
      - name: Prepare signing keystore & key.properties
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?缺少 Secret: KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?缺少 Secret: KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 Secret: KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 Secret: KEY_PASSWORD}"

          KS="$GITHUB_WORKSPACE/android/release-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "✅ keystore 已还原: $KS"

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=%s\n'     "$KS"
          } > android/key.properties
          echo "✅ key.properties 已生成"

          echo "KEYSTORE_FILE=$KS"                  >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS"               >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD"         >> "$GITHUB_ENV"

      # ---------- 诊断：作者 gradle 签名现状（只读） ----------
      - name: Inspect author signing config
        run: |
          F=android/app/build.gradle.kts
          echo "---- $F 签名相关 ----"
          grep -nE "key\.properties|signingConfigs|storeFile|getByName\(\"release\"\)" "$F" || echo "（未匹配）"
          echo "---------------------"

      - run: flutter --version
      - run: flutter pub get

      # ---------- ① 分架构包：armv7 / arm64 / x86_64（release 不含 x86，见说明） ----------
      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi

      # ---------- ② 通用包：含全部 3 架构（不需要可删掉这两行） ----------
      - name: Build universal release APK
        run: flutter build apk --release

      # ---------- 自检：确认没有任何 unsigned 产物 ----------
      - name: Verify all outputs are signed
        run: |
          DIR=build/app/outputs/flutter-apk
          echo "---- 产物列表 ----"
          ls -la "$DIR"
          echo "----------------"
          if ls "$DIR"/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::检测到 unsigned apk！说明 release 未真正签名，请检查 key.properties / build.gradle.kts。"
            exit 1
          fi
          echo "✅ 全部 release apk 均已签名"
          echo "ℹ️ 注意：x86(32位) 因 Dart AOT 不支持，release 不会产出该架构包，属正常现象。"

      # ---------- 生成 SHA-256 校验 ----------
      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          {
            for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk app-release.apk; do
              [ -f "$f" ] && sha256sum "$f"
            done
          } | tee sha256sums.txt

      # ---------- 创建 GitHub Release 并上传全部产物 ----------
      - uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       Sylvakru ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: 'true'
          body: |
            ${{ steps.meta.outputs.notes }}

            ### fork自https://github.com/AfalpHy/sylvakru
            ### 主要修改车机横屏下自动沉浸隐藏了状态栏和导航，仅仅测试在DiLink5.0不自动全屏沉浸

            | 文件 | 适用设备 |
            | **app-arm64-v8a-release.apk** | 64 位 ARM — 绝大多数现代手机（**首选**） |
            | **app-armeabi-v7a-release.apk** | 32 位 ARM — 老旧手机 |
            | **app-x86_64-release.apk** | 64 位 x86 — 模拟器 / ChromeOS / 少数平板 |
            | **app-release.apk** | 通用包 — 含以上全部架构，**不确定架构时选它**（体积较大） |
          files: |
            build/app/outputs/flutter-apk/app*release.apk
            build/app/outputs/flutter-apk/sha256sums.txt
