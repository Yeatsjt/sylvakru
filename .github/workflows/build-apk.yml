name: Release UNSIGNED APK (sign locally with MT)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本号，例如 v1.2.3'
        required: true
      notes:
        description: 'Release 说明（可留空）'
        required: false
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; NOTES="${{ inputs.notes }}"; PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"; NOTES=""; PRE="false"
          fi
          [ -z "$NOTES" ] && NOTES="Automated **unsigned** release build for **$TAG** (arm64 + arm32) — 下载后请用 MT 管理器等工具本地签名再安装。"
          [ -z "$PRE" ]   && PRE="false"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF"      >> "$GITHUB_OUTPUT"
          echo "$NOTES"          >> "$GITHUB_OUTPUT"
          echo "EOF"             >> "$GITHUB_OUTPUT"
          echo "✅ Release tag = $TAG"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: |
          VER=""
          if [ -f .fvmrc ]; then
            VER=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(tr -d '[:space:]' < .fvmrc)
          fi
          VER=${VER:-stable}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "✅ Flutter 版本 = $VER"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 银弹：强制移除 key.properties，使 release 退化为未签名 ----------
      - name: Ensure no signing config (force unsigned)
        run: |
          if [ -f android/key.properties ]; then
            rm -f android/key.properties
            echo "✅ 已移除 key.properties，release 将产出未签名包"
          else
            echo "ℹ️ 本就没有 key.properties，release 将产出未签名包"
          fi

      - run: flutter --version
      - run: flutter pub get

      # ---------- 只 build split 包（不再 build 通用包，省时间） ----------
      - name: Build split-per-abi release (unsigned)
        run: flutter build apk --release --split-per-abi

      # ---------- 列出真实产物（兜底：会看到 arm64/v7a/x86_64 三个 split 包，无通用包） ----------
      - name: List outputs
        run: |
          DIR=build/app/outputs/flutter-apk
          echo "---- 产物列表 ----"
          ls -la "$DIR"
          echo "----------------"

      # ---------- 校验上传目标必须恰好 2 个 + 逐个确认未签名（替代原 checksums 的保护角色） ----------
      - name: Verify upload targets & confirm unsigned
        run: |
          cd build/app/outputs/flutter-apk
          shopt -s nullglob
          targets=( *arm64-v8a-release.apk *armeabi-v7a-release.apk )
          shopt -u nullglob
          if [ "${#targets[@]}" -ne 2 ]; then
            echo "::error::期望恰好 2 个上传目标(arm64-v8a + armeabi-v7a)，实际匹配 ${#targets[@]} 个"
            echo "---- 真实文件 ----"; ls -la
            exit 1
          fi
          for f in "${targets[@]}"; do
            if unzip -l "$f" 2>/dev/null | grep -qiE 'META-INF/.*\.(RSA|EC|DSA|SF)[[:space:]]*$'; then
              echo "⚠️  $f 含 v1 签名块（若期望未签名，请确认 key.properties 已移除）"
            else
              echo "✅ $f 无 v1 签名块 → 未签名，请用 MT 签名后安装"
            fi
          done
          echo "✅ 上传目标齐全：${targets[*]}"

      # ---------- 创建 Release，只上传 arm64 + arm32（无通用包、无 x86_64、无校验文件） ----------
      - uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       Sylvakru ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: 'true'
          body: |
            ${{ steps.meta.outputs.notes }}

            > ⚠️ 以下 apk **未签名**，**不能直接安装**。请下载后用 **MT 管理器 / apksigner / xxx** 本地签名后再装。
            > 建议 MT 签名时**固定使用同一个证书文件**，这样以后升级**无需卸载旧包**。
            
            ### 主要修改车机横屏下自动沉浸隐藏了状态栏和导航，仅仅测试在DiLink5.0不自动全屏沉浸

            | 文件 | 适用设备 |
            |------|----------|
            | **\*-arm64-v8a-release.apk** | 64 位 ARM — 绝大多数现代手机（**首选**） |
            | **\*-armeabi-v7a-release.apk** | 32 位 ARM — 老旧手机 |
          files: |
            build/app/outputs/flutter-apk/*arm64-v8a-release.apk
            build/app/outputs/flutter-apk/*armeabi-v7a-release.apk
