name: Release UNSIGNED APK (sign locally with MT)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本号，例如 v1.2.3'
        required: true
      notes:
        description: 'Release 说明（可留空）'
        required: false
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 解析 tag / 说明 / 预发布 ----------
      - name: Resolve release meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; NOTES="${{ inputs.notes }}"; PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"; NOTES=""; PRE="false"
          fi
          [ -z "$NOTES" ] && NOTES="Automated **unsigned** multi-ABI release build for **$TAG** — 下载后请用 MT 管理器等工具本地签名再安装。"
          [ -z "$PRE" ]   && PRE="false"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF"      >> "$GITHUB_OUTPUT"
          echo "$NOTES"          >> "$GITHUB_OUTPUT"
          echo "EOF"             >> "$GITHUB_OUTPUT"
          echo "✅ Release tag = $TAG"

      # ---------- 读作者钉死的 Flutter 版本 ----------
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: |
          VER=""
          if [ -f .fvmrc ]; then
            VER=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(tr -d '[:space:]' < .fvmrc)
          fi
          VER=${VER:-stable}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "✅ Flutter 版本 = $VER"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 银弹：强制移除 key.properties，确保 release 退化为 unsigned ----------
      - name: Ensure no signing config (force unsigned)
        run: |
          if [ -f android/key.properties ]; then
            rm -f android/key.properties
            echo "✅ 已移除作者提交的 key.properties，release 将产出 unsigned"
          else
            echo "ℹ️ 本就没有 key.properties，release 将产出 unsigned"
          fi

      # ---------- 诊断：作者 gradle 签名现状（只读，帮你确认会退化 unsigned） ----------
      - name: Inspect author signing config
        run: |
          F=android/app/build.gradle.kts
          echo "---- $F 签名相关 ----"
          grep -nE "key\.properties|signingConfigs|storeFile|getByName\(\"release\"\)" "$F" || echo "（未匹配）"
          echo "---------------------"

      - run: flutter --version
      - run: flutter pub get

      # ---------- ① 分架构 unsigned：armv7 / arm64 / x86_64 ----------
      - name: Build split-per-abi release (unsigned)
        run: flutter build apk --release --split-per-abi

      # ---------- ② 通用 unsigned：含全部 3 架构 ----------
      - name: Build universal release (unsigned)
        run: flutter build apk --release

      # ---------- 列出产物（只看不拦，确认 unsigned 已生成） ----------
      - name: List outputs
        run: |
          DIR=build/app/outputs/flutter-apk
          echo "---- 产物列表 ----"
          ls -la "$DIR"
          echo "----------------"
          echo "ℹ️ 期望看到 app-*-release-unsigned.apk 与 app-release-unsigned.apk（未签名，需 MT 补签）。"
          echo "ℹ️ x86(32位) 因 Dart AOT 不支持，release 不产出，属正常。"

      # ---------- 生成 SHA-256（针对 unsigned 文件，方便你核对下载完整性） ----------
      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          {
            for f in app-arm64-v8a-release-unsigned.apk app-armeabi-v7a-release-unsigned.apk app-x86_64-release-unsigned.apk app-release-unsigned.apk; do
              [ -f "$f" ] && sha256sum "$f"
            done
          } | tee sha256sums.txt

      # ---------- 创建 Release，上传 unsigned 半成品 ----------
      - uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       Sylvakru ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: 'true'
          body: |
            ${{ steps.meta.outputs.notes }}

            > ⚠️ 以下 apk **未签名**，**不能直接安装**。请下载后用 **MT 管理器 / apksigner / xxx** 本地签名后再装。
            > 建议 MT 签名时**固定使用同一个证书文件**，这样以后升级**无需卸载旧包**。
            
            ### 主要修改车机横屏下自动沉浸隐藏了状态栏和导航，仅仅测试在DiLink5.0不自动全屏沉浸

            | 文件 | 适用设备 |
            |------|----------|
            | **app-arm64-v8a-release-unsigned.apk** | 64 位 ARM — 绝大多数现代手机（**首选**） |
            | **app-armeabi-v7a-release-unsigned.apk** | 32 位 ARM — 老手机 |
            | **app-x86_64-release-unsigned.apk** | 64 位 x86 — 模拟器 / ChromeOS / 少数平板 |
            | **app-release-unsigned.apk** | 通用包 — 含以上全部架构（体积较大） |
          files: |
            build/app/outputs/flutter-apk/app*unsigned.apk
            build/app/outputs/flutter-apk/sha256sums.txt
