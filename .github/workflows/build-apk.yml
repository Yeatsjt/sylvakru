name: Release UNSIGNED APK (sign locally with MT)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本号，例如 v1.2.3'
        required: true
      notes:
        description: 'Release 说明（可留空）'
        required: false
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release meta
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; NOTES="${{ inputs.notes }}"; PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"; NOTES=""; PRE="false"
          fi
          [ -z "$NOTES" ] && NOTES="Automated **unsigned** multi-ABI release build for **$TAG** — 下载后请用 MT 管理器等工具本地签名再安装。"
          [ -z "$PRE" ]   && PRE="false"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF"      >> "$GITHUB_OUTPUT"
          echo "$NOTES"          >> "$GITHUB_OUTPUT"
          echo "EOF"             >> "$GITHUB_OUTPUT"
          echo "✅ Release tag = $TAG"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: |
          VER=""
          if [ -f .fvmrc ]; then
            VER=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(tr -d '[:space:]' < .fvmrc)
          fi
          VER=${VER:-stable}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "✅ Flutter 版本 = $VER"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 银弹：强制移除 key.properties，使 release 退化为 unsigned ----------
      - name: Ensure no signing config (force unsigned)
        run: |
          if [ -f android/key.properties ]; then
            rm -f android/key.properties
            echo "✅ 已移除 key.properties，release 将产出 unsigned"
          else
            echo "ℹ️ 本就没有 key.properties，release 将产出 unsigned"
          fi

      - run: flutter --version
      - run: flutter pub get

      - name: Build split-per-abi release (unsigned)
        run: flutter build apk --release --split-per-abi

      - name: Build universal release (unsigned)
        run: flutter build apk --release

      # ---------- 列出产物：盯一眼真实文件名前缀（sylvakru / senlu / app 都行） ----------
      - name: List outputs
        run: |
          DIR=build/app/outputs/flutter-apk
          echo "---- 产物列表 ----"
          ls -la "$DIR"
          echo "----------------"

      # ---------- 校验和：前缀无关通配 + 空保护（匹配不到就直接报错并 ls，不再生成空文件） ----------
      - name: Generate checksums
        run: |
          cd build/app/outputs/flutter-apk
          if ! ls *release-unsigned.apk >/dev/null 2>&1; then
            echo "::error::没有匹配到 *release-unsigned.apk！真实文件如下，请把这份列表反馈："
            ls -la
            exit 1
          fi
          sha256sum *release-unsigned.apk | tee sha256sums.txt
          echo "✅ 校验和已生成（非空）"

      # ---------- 创建 Release，上传 unsigned 半成品（前缀无关通配） ----------
      - uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.meta.outputs.tag }}
          name:       Sylvakru ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: 'true'
          body: |
            ${{ steps.meta.outputs.notes }}

            > ⚠️ 以下 apk **未签名**，**不能直接安装**。请下载后用 **MT 管理器 / apksigner / xxx** 本地签名后再装。
            > 建议 MT 签名时**固定使用同一个证书文件**，这样以后升级**无需卸载旧包**。
            
            ### 主要修改车机横屏下自动沉浸隐藏了状态栏和导航，仅仅测试在DiLink5.0不自动全屏沉浸

            | 文件 | 适用设备 |
            |------|----------|
            | **\*-arm64-v8a-release-unsigned.apk** | 64 位 ARM — 绝大多数现代手机（**首选**） |
            | **\*-armeabi-v7a-release-unsigned.apk** | 32 位 ARM — 老旧手机 |
            | **\*-x86_64-release-unsigned.apk** | 64 位 x86 — 模拟器 / ChromeOS |
            | **\*-release-unsigned.apk**（通用） | 含以上全部架构 |
          files: |
            build/app/outputs/flutter-apk/*release-unsigned.apk
            build/app/outputs/flutter-apk/sha256sums.txt
