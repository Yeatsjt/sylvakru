
name: Build APK

# 支持手动触发（临时打包用这个）
on:
  workflow_dispatch:       # ← 手动点击触发
  push:
    branches: [ main ]     # 可选：push 到 main 也自动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 授予 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 上传 APK 为 Artifact（供下载）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7   # 保留7天
