name: Build Flutter APK

on:
  workflow_dispatch:          # 手动触发；需要 push 自动触发再取消下面注释
  # push:
  #   branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ① 读 .fvmrc 里作者钉死的 Flutter 版本，保证和本地一致
      - name: Read Flutter version from .fvmrc
        id: fvm
        run: |
          VER=""
          if [ -f .fvmrc ]; then
            VER=$(jq -r '.flutter // .flutterSdkVersion // empty' .fvmrc 2>/dev/null || true)
            [ -z "$VER" ] && VER=$(tr -d '[:space:]' < .fvmrc)   # 兜底：纯文本格式
          fi
          VER=${VER:-stable}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "✅ 将使用 Flutter 版本: $VER"

      # ② 装对应版本的 Flutter（cache 加速后续构建）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # ③ JDK 17（Flutter 3.x 的 Android 构建需要）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter --version
      - run: flutter pub get

      # ④ 打 debug apk（自带签名，可直接装手机）
      - run: flutter build apk --debug

      # ⑤ 上传产物（注意路径在【仓库根】的 build/ 下，不是 android/ 下）
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
